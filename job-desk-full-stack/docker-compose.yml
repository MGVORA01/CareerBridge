services:
  jobdeskmysql:
    image: mysql:latest
    container_name: jobdeskmysql
    restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "${MYSQL_HOST_PORT}:${MYSQL_CONTAINER_PORT}"   # host:container
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - jobdesk-network

  jobdesk-backend:
    build: ./backend
    container_name: jobdesk-backend
    ports:
      - "${BACKEND_PORT}:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://jobdeskmysql:${MYSQL_CONTAINER_PORT}/${MYSQL_DATABASE}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
    depends_on:
      - jobdeskmysql
    networks:
      - jobdesk-network

  jobdesk-frontend:
    build: ./frontend
    container_name: jobdesk-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - jobdesk-backend
    networks:
      - jobdesk-network

networks:
  jobdesk-network:

volumes:
  db_data:
